name: Update public VPS offers

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape public provider pages
        run: python scraper.py
      - name: Build static site
        run: python build.py
      - name: Commit generated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/social_queue.json site/
          git diff --cached --quiet || git commit -m "Update public VPS offers"
          git push
